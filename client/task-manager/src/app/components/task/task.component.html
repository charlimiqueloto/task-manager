<h2 class="p10">Task Manager</h2>
<form (ngSubmit)="addTask()">
    <div class="task-form">
        <div class="mb-3">
            <input class="form-control" [(ngModel)]="newTask.title" name="title" placeholder="Title" required />
        </div>
        <div class="mb-3">
            <input class="form-control" [(ngModel)]="newTask.description" name="description" placeholder="description" required />
        </div>
        <div class="mb-3">
            <select class="form-select" [(ngModel)]="newTask.status" name="status">
                <option value="pending">Pending</option>
                <option value="in-progress">In-progress</option>
                <option value="done">Done</option>
            </select>
        </div>
        <div class="mb-3">
            <input class="form-control" [(ngModel)]="newTask.dueDate" name="dueDate" type="date" required />
        </div>
        <button type="submit" class="btn btn-primary">Add Task</button>
    </div>
</form>

<ul class="list-group list-group-flush">
    <li *ngFor="let task of tasks" class="list-group-item">
        {{task.title}} - {{task.status}}
        <button (click)="deleteTask(task._id!)" class="btn btn-danger">Delete</button>
    </li>
</ul>
